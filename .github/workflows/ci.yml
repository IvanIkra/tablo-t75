name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  service:
    name: Service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: service/uv.lock
      - run: uv sync --locked
      - run: uv run pytest -q

  ha-integration:
    name: Home Assistant integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ha-integration
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: ha-integration/uv.lock
      - run: uv sync --locked
      - run: uv run pytest -q

  firmware:
    name: Firmware build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - run: cp include/secrets.example.h include/secrets.h
      - run: pio run -e esp32
