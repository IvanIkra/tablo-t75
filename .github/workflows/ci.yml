name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  service:
    name: Service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: service/pyproject.toml
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q

  ha-integration:
    name: Home Assistant integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ha-integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ha-integration/pyproject.toml
      - run: pip install homeassistant==2026.4.4 pytest-homeassistant-custom-component==0.13.325 -e ../service
      - run: python -m pytest -q

  firmware:
    name: Firmware build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - run: cp include/secrets.example.h include/secrets.h
      - run: pio run -e esp32
