# Tablo service config for development (§6.5).
# Later the Home Assistant integration sends the same structure to PUT /api/config.
# Real tokens go in the environment (TABLO_DEVICE_TOKEN, TABLO_API_TOKEN), not here.

server:
  host: 0.0.0.0
  port: 8765

device:
  token: dev-device-token
api:
  token: dev-api-token

# The service's own link to HA (§8.1); the long-lived token goes in .env as TABLO_HA_TOKEN.
# Without a token only the fake HA (the "fake HA" demo switch) is there.
ha:
  url: http://192.168.1.50:8123

weather:
  latitude: 55.7558
  longitude: 37.6173

home:
  # Rows of the Home block (§8.3): HA renders each template; an empty result hides the row.
  # An empty label puts the value at the left edge. Printer: Moonraker integration in HA (checked 18.10).
  rows:
    - label: ''
      template: '{{ states(''sensor.room_sensor_temperature'') | round(1) }}° · {{ states(''sensor.room_sensor_humidity'') | round(0) | int }}%'
    - label: 'lights'
      template: '{{ [''light.ceiling_light'', ''light.desk_lamp'', ''light.desk_light'', ''light.desk_backlight'', ''light.closet_light''] | select(''is_state'', ''on'') | list | count }} of 5'
    - label: 'printing'
      template: '{% if is_state(''sensor.printer_current_print_state'', ''printing'') %}{{ states(''sensor.printer_progress'') | round(0) | int }}% · {% set unit = {''s'': 1 / 60, ''min'': 1, ''h'': 60, ''d'': 1440}[state_attr(''sensor.printer_print_time_left'', ''unit_of_measurement'')] %}{% set m = (states(''sensor.printer_print_time_left'') | float(0) * unit) | round(0) | int %}{{ m // 60 }}:{{ ''%02d'' % (m % 60) }}{% endif %}'

display:
  tz: MSK-3
  tz_name: Europe/Moscow
  semester_start: 2026-09-01
  long_press_ms: 600
  full_refresh: {at: "04:00", max_partials: 200}
  offline_after_s: 120
  diag_ttl_s: 30
  font_mode: aliased

overlays:
  qr_duration_s: 20
  message_duration_s: 30

news:
  channels:
    - {name: example_se, study: true}   # ПИ объявления
    - example_news3
    - example_news2
    - example_news1
  ttl_hours: 24

wifi_networks:
  - {ssid: Home, password: change-me, security: WPA}
  - {ssid: VPN AP, password: change-me-too, security: WPA}

buttons:
  - id: 1
    icon: mdi:power
    tile: none
    short: {action: script, entity: script.all_lights_on}
    long: {action: script, entity: script.all_lights_off}
  - id: 2
    icon: mdi:ceiling-light
    short: {action: toggle, entity: light.ceiling_light}
    long: {action: script, entity: script.solo_ceiling}
  - id: 3
    icon: mdi:lamp
    short: {action: toggle, entity: light.desk_lamp}
    long: {action: script, entity: script.lamp_brightness_cycle}
  - id: 4
    icon: mdi:desk
    short: {action: toggle, entity: light.desk_light}
    long: {action: script, entity: script.solo_desk}
  - id: 5
    icon: mdi:led-strip-variant
    short: {action: toggle, entity: light.desk_backlight}
    long: {action: script, entity: script.backlight_color_cycle}
  - id: 6
    icon: mdi:hanger
    short: {action: toggle, entity: light.closet_light}
    long: {action: script, entity: script.closet_5min}
  - id: 7
    icon: mdi:wifi
    short: {action: toggle, entity: switch.vpn_ap}
    long: {action: qr}
