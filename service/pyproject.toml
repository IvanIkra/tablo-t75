[project]
name = "tablo-service"
version = "0.1.0"
description = "Tablo T75 e-ink panel service: data, frame rendering, device protocol"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
    "pillow>=11",
    "pyyaml>=6",
    "segno>=1.6",
    "openpyxl>=3.1",
    "anthropic>=1.15",
    "icalendar>=6",
    "jinja2>=3.1",  # the fake HA renders Home templates like HA does
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tablo", "tablo.render", "tablo.sources"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-aiohttp>=1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
