# Production run on the server (§12): cd ~/tablo && docker compose up -d --build
# Deployment values (bind address, DNS, HA URL) come from .env, see .env.example.
# infomaster must be up first: its compose creates the "infomaster" network Tablo joins to reach
# http://infomaster:8081 (deadlines, news, grades, tablo.ics) by service name.
# Bridge network, not host: with network_mode: host the container would take the host's DNS,
# so DNS is set explicitly.
services:
  tablo:
    build: .
    image: tablo:latest
    container_name: tablo
    restart: unless-stopped
    networks: [default, infomaster]
    ports:
      # One LAN address only: another service on the host may already hold 127.0.0.1:8765.
      - "${TABLO_BIND_IP:?set TABLO_BIND_IP in .env}:8765:8765"
    dns:
      - ${TABLO_DNS:?set TABLO_DNS in .env}
      - ${TABLO_DNS_FALLBACK:?set TABLO_DNS_FALLBACK in .env}
    env_file: .env
    environment:
      TZ: Europe/Moscow
    volumes:
      - ./data:/app/data
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

networks:
  infomaster:
    external: true
