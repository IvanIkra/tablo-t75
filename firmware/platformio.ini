; Tablo T75 firmware: ESP32-L(C02) + DESPI-C02 + GDEY075T7 (tablo-software.md §10).
; Wi-Fi, service address and tokens: include/secrets.h (copy secrets.example.h).

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; 921600 drops on this board, 115200 is reliable
upload_speed = 115200
; two 1.9 MB app slots for OTA: Wi-Fi + WebSockets + OTA do not fit the default 1.25 MB
board_build.partitions = min_spiffs.csv
lib_deps =
    zinggjm/GxEPD2@^1.6.0
    links2004/WebSockets@^2.6.1
    bblanchon/ArduinoJson@^7.2.0
; a frame is 20 + 48 000 bytes in one WebSocket message: lift the library's 15 KB limit
extra_scripts = pre:tools/patch_websockets.py

; Over the air, after the first flash by USB: pio run -e ota -t upload
[env:ota]
extends = env:esp32
upload_protocol = espota
upload_port = tablo.local
upload_flags =
    --auth=${sysenv.TABLO_OTA_PASSWORD}
