; Tablo T75 firmware: ESP32-L(C02) + DESPI-C02 + GDEY075T7 (tablo-software.md §10).
; Wi-Fi, service address and tokens: include/secrets.h (copy secrets.example.h).

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; 921600 drops on this board, 115200 is reliable
upload_speed = 115200
; two 1.9 MB app slots for OTA: Wi-Fi + WebSockets + OTA do not fit the default 1.25 MB
board_build.partitions = min_spiffs.csv
lib_deps =
    zinggjm/GxEPD2@^1.6.0
    links2004/WebSockets@^2.6.1
    bblanchon/ArduinoJson@^7.2.0
; a frame is 20 + 48 000 bytes in one WebSocket message: lift the library's 15 KB limit
; and receive it into a buffer reserved at start (src/link.cpp); the git commit goes
; into the firmware version
extra_scripts =
    pre:tools/patch_websockets.py
    pre:tools/fw_version.py
; on bad Wi-Fi a 48 KB frame takes longer than the default 5 s; the link has its own
; task, so waiting does not hold up the panel or the buttons
build_flags = -DWEBSOCKETS_TCP_TIMEOUT=15000

; Over the air, after the first flash by USB: pio run -e ota -t upload
[env:ota]
extends = env:esp32
upload_protocol = espota
upload_port = tablo.local
upload_flags =
    --auth=${sysenv.TABLO_OTA_PASSWORD}

; Through the service (§10): it offers the image and the board downloads it itself, one
; stream that rides out Wi-Fi stalls. pio run -e service -t upload; TABLO_API_TOKEN in
; the shell or service/.env. The env above stays for when the link to the service is down.
[env:service]
extends = env:esp32
upload_protocol = custom
upload_command = $PYTHONEXE tools/ota_service.py $SOURCE
